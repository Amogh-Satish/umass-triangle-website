<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Admin</title>
  <link rel="icon" href="/img/logo-placeholder.svg">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
  <style>
    body { font-size: 15px; }
    .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 80px; }
    .admin-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .admin-top h1 { font-size: 1.5rem; margin: 0; display: flex; gap: 10px; align-items: center; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
    .tabs button { background: none; border: 0; color: var(--muted); padding: 10px 14px; font: inherit; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; }
    .tabs button.active { color: #fff; border-color: var(--accent); }
    .panel { background: var(--surface); border-radius: 14px; padding: 22px; }
    .panel h2 { margin: 0 0 6px; font-size: 1.25rem; }
    .panel > p.help { color: var(--muted); margin: 0 0 18px; }
    .row-item { display: grid; gap: 10px; align-items: end; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .row-item img.thumb { width: 72px; height: 54px; object-fit: cover; border-radius: 6px; background: var(--bg); }
    .btn { background: var(--surface-2); color: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; font: inherit; cursor: pointer; white-space: nowrap; }
    .btn:hover { border-color: #fff; }
    .btn.danger { color: #ff8a8a; }
    .btn.primary { background: var(--accent); border-color: var(--accent); }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
    fieldset { border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin: 0 0 14px; }
    legend { color: var(--muted); padding: 0 6px; font-size: .85rem; text-transform: uppercase; letter-spacing: 1px; }
    .field { margin-bottom: 12px; }
    .field .with-upload { display: flex; gap: 8px; }
    .checklist li { padding: 6px 0; border-bottom: 1px solid var(--border); }
    .checklist code { color: var(--muted); font-size: .85rem; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .table-scroll { overflow-x: auto; }
    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 10px 18px; border-radius: 8px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 1000; }
    #toast.show { opacity: 1; }
    .login { max-width: 360px; margin: 18vh auto 0; }
  </style>
</head>
<body>
  <div class="admin-wrap">
    <div id="login-view" class="panel login" hidden>
      <h2>Admin sign in</h2>
      <p class="help" style="color:var(--muted)">Password is <code>ADMIN_PASSWORD</code> in <code>.env</code>.</p>
      <form id="login-form">
        <div class="field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required></div>
        <button class="btn primary" type="submit">Sign in</button>
        <div class="form-msg err" id="login-msg"></div>
      </form>
    </div>

    <div id="app-view" hidden>
      <div class="admin-top">
        <h1><img src="/img/logo-placeholder.svg" alt="" width="30"> Site Admin</h1>
        <div class="actions" style="margin:0">
          <a class="btn" href="/" target="_blank">View site <i class="bi bi-box-arrow-up-right"></i></a>
          <button class="btn" id="logout">Sign out</button>
        </div>
      </div>
      <div class="tabs" id="tabs"></div>
      <div class="panel" id="panel"></div>
    </div>
  </div>
  <div id="toast"></div>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
