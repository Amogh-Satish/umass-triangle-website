<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triangle</title>
  <meta name="description" content="Triangle Fraternity — the social fraternity of engineers, architects, and scientists.">
  <link rel="icon" href="/img/logo-placeholder.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/glightbox@3.3.0/dist/css/glightbox.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>
  <div id="preloader" aria-hidden="true">
    <svg class="tri" viewBox="0 0 100 90" width="150" height="135">
      <line class="side s1" x1="50" y1="6" x2="94" y2="84"/>
      <line class="side s2" x1="94" y1="84" x2="6" y2="84"/>
      <line class="side s3" x1="6" y1="84" x2="50" y2="6"/>
    </svg>
  </div>
  <section class="hero" id="hero" data-aos="fade" data-aos-delay="1400">
    <div>
      <h2><span id="hero-chapter"></span><br><span id="hero-university" style="color:#fff;filter:none;font-weight:700"></span></h2>
      <div class="hero-subtitle" id="hero-tagline"></div>
      <div><a href="/rush" class="btn-accent">Rush Triangle</a></div>
    </div>
  </section>

  <main data-aos="fade">
    <section class="gallery">
      <div class="gallery-grid" id="gallery-grid"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/glightbox@3.3.0/dist/js/glightbox.min.js"></script>
  <script type="module" src="/js/home.js"></script>
</body>
</html>
